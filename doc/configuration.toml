# FIX FAST Market Data Receiver Configuration

[general]
exchange = "MOEX"

### default: exchange_branch = "ASTS"
exchange_branch = "SPECTRA"

### has_message_preamble: Bool, true if a packet has a sequence number preample.
### has_message_preamble = true

### dictionary_reset: Bool, reset template dictionaries after reception of new message.
### dictionary_reset = true

template_file_name = "spectra-templates.xml"
#template_file_name = "FIX50SP2-2025-Oct.xml"
template_dir_path = "doc"

# ============================================================================
# Feed groups — each group corresponds to a multicast subscription set
# ============================================================================

[[groups]]
name = "FEED_1"

[[groups.feeds]]
name = "A"
multicast_group = "239.195.5.65"
multicast_port = 36065
source_ip = "91.203.253.232"

[[groups.feeds]]
name = "B"
multicast_group = "239.195.133.65"
multicast_port = 37065
source_ip = "91.203.255.232"

[[groups.replay]]
address = [ "91.203.253.232", "91.203.255.232" ]
port = 7027

